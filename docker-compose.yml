services:
  website:
    build:
      context: .
      dockerfile: website/Dockerfile
    restart: unless-stopped
    # Runs as the host user so the SQLite file in DATA_DIR is owned by it, and the
    # database platform's Airflow (same uid) can read and update it.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${DATA_DIR:-./data}:/app/data   # website.db (see website/server/store.py)
